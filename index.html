<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070609">
  <meta name="description" content="CINEX — Cinematic Experience">
  <title>CINEX — Enter the Cinema</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;0,900;1,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #ff244b;
      --red-glow: rgba(255, 36, 75, 0.45);
      --bg: #070609;
      --card-bg: #110d14;
      --muted: #a7a0a7;
      --line: rgba(255, 255, 255, 0.11);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: 'Inter', Arial, sans-serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* ==========================================
       1. CINEX SITE INTRO OVERLAY
       ========================================== */
    #cinex-intro {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #050407;
      overflow: hidden;
      animation: cinexIntroOut 0.8s ease 3.2s forwards;
    }

    .cinex-intro-film {
      position: absolute;
      inset: -50px;
      opacity: 0.18;
      background: repeating-linear-gradient(
        90deg,
        transparent 0 42px,
        var(--red) 43px 45px,
        transparent 46px 88px
      );
      animation: cinexFilmMove 1.8s linear infinite;
    }

    .cinex-intro-content {
      position: relative;
      text-align: center;
      animation: cinexLogoIn 1s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .cinex-intro-logo {
      margin: 0;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(55px, 14vw, 110px);
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 35px var(--red-glow);
    }
    .cinex-intro-logo span { color: var(--red); }

    .cinex-intro-subtitle {
      margin-top: 6px;
      color: #ccc;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 6px;
    }

    .cinex-intro-loader {
      width: 180px;
      height: 3px;
      margin: 28px auto 0;
      background: #1f1a24;
      border-radius: 4px;
      overflow: hidden;
    }

    .cinex-intro-loader::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
      animation: cinexLoading 2.6s ease-in-out forwards;
    }

    @keyframes cinexLogoIn {
      from { opacity: 0; transform: scale(0.82) translateY(15px); filter: blur(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
    @keyframes cinexFilmMove {
      from { transform: translateX(-45px) rotate(1deg); }
      to { transform: translateX(45px) rotate(-1deg); }
    }
    @keyframes cinexLoading {
      from { width: 0%; }
      to { width: 100%; }
    }
    @keyframes cinexIntroOut {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    /* ==========================================
       2. AMBIENT BACKGROUND ANIMATIONS
       ========================================== */
    .bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 36, 75, 0.4);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 36, 75, 0.8);
      animation: particleFloat 12s infinite linear;
    }
    .particle:nth-child(1) { left: 10%; top: 90%; animation-duration: 14s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 35%; top: 85%; animation-duration: 9s;  animation-delay: -3s; }
    .particle:nth-child(3) { left: 65%; top: 95%; animation-duration: 16s; animation-delay: -5s; }
    .particle:nth-child(4) { left: 85%; top: 80%; animation-duration: 11s; animation-delay: -2s; }
    .particle:nth-child(5) { left: 50%; top: 75%; animation-duration: 13s; animation-delay: -7s; }

    @keyframes particleFloat {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.6; }
      100% { transform: translateY(-100vh) scale(1.3); opacity: 0; }
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
      opacity: .07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E");
    }

    .ambient-orb {
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      filter: blur(90px);
      opacity: 0.22;
      animation: orbBreathe 8s ease-in-out infinite alternate;
    }
    .orb-1 { top: -100px; left: -100px; background: var(--red); }
    .orb-2 { bottom: -100px; right: -100px; background: #820f26; animation-delay: -4s; }

    @keyframes orbBreathe {
      from { transform: scale(0.9) translate(0, 0); opacity: 0.18; }
      to { transform: scale(1.2) translate(30px, 30px); opacity: 0.28; }
    }

    /* ==========================================
       3. HEADER & TOP NAVIGATION
       ========================================== */
    header {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 70px;
      padding: 12px clamp(18px, 5vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(7, 6, 9, 0.85);
      backdrop-filter: blur(15px);
    }
    
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.12em;
      white-space: nowrap;
      animation: logoPulse 4s ease-in-out infinite;
    }
    .logo span { color: var(--red); }

    @keyframes logoPulse {
      0%, 100% { text-shadow: 0 0 0 transparent; }
      50% { text-shadow: 0 0 18px var(--red-glow); }
    }

    nav {
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.8vw, 20px);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    nav a {
      color: #d5cdd3;
      padding: 7px 12px;
      border-radius: 8px;
      transition: all 0.25s ease;
    }
    nav a:hover { color: var(--red); background: rgba(255, 36, 75, 0.08); }
    
    .nav-sub-btn {
      border: 1px solid var(--red) !important;
      background: rgba(255, 36, 75, 0.15) !important;
      color: #fff !important;
      box-shadow: 0 0 18px rgba(255, 36, 75, 0.25);
    }
    .nav-sub-btn:hover {
      background: var(--red) !important;
      box-shadow: 0 0 25px rgba(255, 36, 75, 0.5);
      transform: translateY(-2px);
    }

    /* ==========================================
       4. CLEAN TOP SECTION WITH FLOATING SCREENS
       ========================================== */
    .clean-hero {
      position: relative;
      padding-top: 110px;
      padding-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      isolation: isolate;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 20%, #220812 0%, #0c070c 50%, #050406 90%);
    }

    .laser-beam {
      position: absolute;
      top: -20%;
      height: 140%;
      width: 2px;
      background: linear-gradient(transparent, rgba(255, 36, 75, 0.35), transparent);
      box-shadow: 0 0 45px 12px rgba(255, 24, 62, 0.15);
      transform: rotate(22deg);
      animation: laserPulse 7s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .laser-beam.b1 { left: 15%; }
    .laser-beam.b2 { right: 15%; transform: rotate(-22deg); animation-delay: -3.5s; }

    @keyframes laserPulse {
      0% { opacity: 0.2; transform: translateY(-30px) rotate(22deg); }
      100% { opacity: 0.7; transform: translateY(30px) rotate(22deg); }
    }

    .top-title-wrap {
      z-index: 10;
      position: relative;
      padding: 0 20px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.35em;
      font-weight: 800;
      color: #ff758c;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding: 4px 14px;
      border-radius: 20px;
      background: rgba(255, 36, 75, 0.08);
      border: 1px solid rgba(255, 36, 75, 0.25);
    }

    /* Clean Compact Page Title */
    .top-title-wrap h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: 0.06em;
      font-size: clamp(32px, 5vw, 56px);
      margin: 6px 0 10px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .top-title-wrap h1 span {
      color: var(--red);
      text-shadow: 0 0 25px var(--red-glow);
    }

    /* Dual Side Floating Film Screens */
    .film-screen {
      position: absolute;
      width: clamp(120px, 15vw, 210px);
      aspect-ratio: 16/10;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: #150f18;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 20px rgba(255, 36, 75, 0.2);
      border-radius: 12px;
      z-index: 5;
      opacity: 0.85;
      will-change: transform;
    }
    
    .screen-left {
      left: 2%;
      top: 22%;
      animation: floatSmoothLeft 6s ease-in-out infinite alternate;
    }
    .screen-right {
      right: 2%;
      top: 25%;
      animation: floatSmoothRight 7s ease-in-out infinite alternate;
    }

    .scene-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.1) brightness(0.9);
      transition: transform 0.5s ease;
    }
    .film-screen:hover .scene-preview { transform: scale(1.1); }

    .screen-caption {
      position: absolute;
      bottom: 6px;
      left: 8px;
      z-index: 2;
      font-size: 8px;
      letter-spacing: 0.15em;
      color: #fff;
      font-weight: 800;
      background: rgba(0,0,0,0.6);
      padding: 2px 6px;
      border-radius: 4px;
    }

    @keyframes floatSmoothLeft {
      0% { transform: translateY(0) rotate(-3deg); }
      100% { transform: translateY(-24px) rotate(2deg); }
    }
    @keyframes floatSmoothRight {
      0% { transform: translateY(0) rotate(3deg); }
      100% { transform: translateY(-28px) rotate(-2deg); }
    }

    /* ==========================================
       5. FILM NAVIGATION BAR & MOVIE COLLECTION
       ========================================== */
    .film-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 80px;
      position: relative;
      z-index: 10;
    }

    /* Dedicated Film Nav Bar */
    .film-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(17, 13, 20, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 20px;
      border-radius: 16px;
      backdrop-filter: blur(10px);
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .film-nav-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .film-nav-title span { color: var(--red); }

    .video-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .video-filter {
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: #0d0a0f;
      color: #cfc6cd;
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 0.12em;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 8px;
      transition: all 0.25s ease;
    }
    .video-filter:hover, .video-filter.active {
      color: #fff;
      border-color: var(--red);
      background: rgba(255, 36, 75, 0.2);
      box-shadow: 0 0 15px rgba(255, 36, 75, 0.25);
    }

    /* Compact Square / Poster Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 20px;
    }

    .movie-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .movie-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: rgba(255, 36, 75, 0.6);
      box-shadow: 0 18px 40px rgba(0,0,0,0.7), 0 0 25px rgba(255, 36, 75, 0.25);
    }

    /* Floating Image Container Inside Card */
    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1.15;
      overflow: hidden;
      background: #19121d;
    }

    .card-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.4s ease;
      animation: idlePosterFloat 6s ease-in-out infinite alternate;
    }
    
    .movie-card:hover .card-thumb-wrap img {
      transform: scale(1.08) translateY(-4px);
      filter: brightness(1.05);
      animation-play-state: paused;
    }

    @keyframes idlePosterFloat {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-6px) scale(1.03); }
    }

    .card-category-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 3;
      background: rgba(7, 6, 9, 0.85);
      border: 1px solid var(--red);
      padding: 4px 8px;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .play-btn-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 60%);
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }
    .movie-card:hover .play-btn-overlay { opacity: 1; }

    .play-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      padding-left: 3px;
      box-shadow: 0 0 20px rgba(255, 36, 75, 0.6);
      transition: transform 0.3s ease;
    }
    .movie-card:hover .play-icon { transform: scale(1.15); }

    .card-info {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-info h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 21px;
      letter-spacing: 0.04em;
      margin: 0 0 6px;
      color: #fff;
      line-height: 1.1;
    }

    .card-info p {
      font-size: 11px;
      color: #a39ca4;
      line-height: 1.5;
      margin: 0 0 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-link {
      margin-top: auto;
      font-size: 10px;
      font-weight: 800;
      color: #ff758c;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Skeleton Loader */
    .skeleton-card {
      height: 270px;
      background: linear-gradient(90deg, #120e16 25%, #1e1724 50%, #120e16 75%);
      background-size: 200% 100%;
      animation: skeletonLoading 1.5s infinite;
      border-radius: 16px;
    }
    @keyframes skeletonLoading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ==========================================
       6. FOOTER & VISITOR COUNTER
       ========================================== */
    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px clamp(20px, 5vw, 80px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      font-size: 12px;
      color: #8c848e;
      background: #050406;
      position: relative;
      z-index: 10;
    }

    .visitor-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 36, 75, 0.1);
      border: 1px solid rgba(255, 36, 75, 0.3);
      color: #ff8599;
      font-weight: 700;
      font-size: 11px;
    }
    .visitor-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 10px var(--red);
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }

    /* Responsive adjustments */
    @media (max-width: 900px) {
      .film-screen { display: none; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
      .card-info h3 { font-size: 18px; }
    }
    @media (max-width: 600px) {
      header { flex-direction: column; padding: 10px 16px; gap: 8px; }
      nav { gap: 6px; font-size: 9px; flex-wrap: wrap; justify-content: center; }
      .clean-hero { padding-top: 125px; }
      footer { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- 1. INTRO ANIMATION OVERLAY -->
  <div id="cinex-intro" aria-label="CINEX Intro">
    <div class="cinex-intro-film"></div>
    <div class="cinex-intro-content">
      <h1 class="cinex-intro-logo">CINE<span>X</span></h1>
      <div class="cinex-intro-subtitle">ENTER THE CINEMA</div>
      <div class="cinex-intro-loader"></div>
    </div>
  </div>

  <!-- 2. AMBIENT BACKGROUND ELEMENTS -->
  <div class="grain"></div>
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="bg-particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <!-- 3. MAIN HEADER -->
  <header>
    <a href="#home" class="logo">CINE<span>X</span></a>
    <nav>
      <a href="#home">HOME</a>
      <a href="#films">FILMS</a>
      <a href="#categories">CATEGORIES</a>
      <a href="https://www.youtube.com/@cinex-c7m?sub_confirmation=1" target="_blank" rel="noopener" class="nav-sub-btn">SUBSCRIBE ↗</a>
    </nav>
  </header>

  <main id="home">
    <!-- 4. CLEAN TOP SECTION -->
    <section class="clean-hero">
      <div class="laser-beam b1"></div>
      <div class="laser-beam b2"></div>

      <!-- Left Floating Film Frame -->
      <div class="film-screen screen-left">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80" alt="Cinema Screen" class="scene-preview">
        <div class="screen-caption">CINEX REEL 01</div>
      </div>

      <div class="top-title-wrap">
        <div class="eyebrow">CINEX STREAMING PLATFORM</div>
        <h1>CINEX <span>CINEMA</span></h1>
      </div>

      <!-- Right Floating Film Frame -->
      <div class="film-screen screen-right">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80" alt="Cinema Screen" class="scene-preview">
        <div class="screen-caption">CINEX REEL 02</div>
      </div>
    </section>

    <!-- 5. FILM COLLECTION SECTION WITH FILM NAV BAR -->
    <section class="film-container" id="films">
      
      <!-- Film Navigation & Category Toolbar -->
      <div class="film-nav-bar" id="categories">
        <div class="film-nav-title">
          🎬 FILM <span>LIBRARY</span>
        </div>
        <div class="video-toolbar" role="group" aria-label="Filter Movies">
          <button class="video-filter active" data-filter="all">ALL MOVIES</button>
          <button class="video-filter" data-filter="Animation">ANIMATION</button>
          <button class="video-filter" data-filter="Action">ACTION</button>
          <button class="video-filter" data-filter="Adventure">ADVENTURE</button>
          <button class="video-filter" data-filter="Drama">DRAMA</button>
          <button class="video-filter" data-filter="Horror">HORROR</button>
          <button class="video-filter" data-filter="Marvel">MARVEL</button>
          <button class="video-filter" data-filter="Romance">ROMANCE</button>
          <button class="video-filter" data-filter="Sci-Fi">SCI-FI</button>
          <button class="video-filter" data-filter="Comedy">COMEDY</button>
          <button class="video-filter" data-filter="Thriller">THRILLER</button>
        </div>
      </div>

      <!-- Movie Card Grid (Dynamically Populated via Firestore) -->
      <div class="movie-grid" id="movieGrid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
    </section>
  </main>

  <!-- FIREBASE INTEGRATION MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, doc, getDoc, setDoc, updateDoc, increment 
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA5t1V-cXpPYQJvMzQlrM5hhaVmTn1DtR8",
      authDomain: "cinex-admin.firebaseapp.com",
      projectId: "cinex-admin",
      storageBucket: "cinex-admin.firebasestorage.app",
      messagingSenderId: "454196788255",
      appId: "1:454196788255:web:bdd192ef01b334abae292a",
      measurementId: "G-CRNR7BQRQ1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let moviesList = [];
    const movieGrid = document.getElementById("movieGrid");

    // Realtime Listener for Movies Collection
    onSnapshot(collection(db, "movies"), (snapshot) => {
      moviesList = [];
      snapshot.forEach((docSnap) => {
        moviesList.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderGrid(moviesList);
    }, (error) => {
      console.error("Firestore Movie Load Error:", error);
      movieGrid.innerHTML = `<p style="color:#ff8ca1;grid-column:1/-1;">Error fetching films from database.</p>`;
    });

    // Render Movie Cards
    function renderGrid(data) {
      if (!data || data.length === 0) {
        movieGrid.innerHTML = `<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">No movies currently listed in database.</p>`;
        return;
      }

      let html = "";
      data.forEach(item => {
        const poster = item.image || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=600&q=80";
        const link = item.url || "#";
        const category = item.category || "Film";

        html += `
          <div class="movie-card">
            <div class="card-thumb-wrap">
              <span class="card-category-tag">${category}</span>
              <img src="${poster}" alt="${item.title}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='https://placehold.co/400x500/120b12/ff244b?text=CINEX'">
              <a href="${link}" target="_blank" rel="noopener" class="play-btn-overlay" aria-label="Play ${item.title}">
                <div class="play-icon">▶</div>
              </a>
            </div>
            <div class="card-info">
              <h3>${item.title || 'Untitled Movie'}</h3>
              <p>${item.description || 'Watch now on CINEX platform.'}</p>
              <a href="${link}" target="_blank" rel="noopener" class="card-link">WATCH NOW ➔</a>
            </div>
          </div>
        `;
      });
      movieGrid.innerHTML = html;
    }

    // Filter Buttons Listener
    document.querySelectorAll(".video-filter").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".video-filter").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");

        const filter = e.target.dataset.filter;
        if (filter === "all") {
          renderGrid(moviesList);
        } else {
          const filtered = moviesList.filter(m => m.category && m.category.toLowerCase() === filter.toLowerCase());
          renderGrid(filtered);
        }
      });
    });

    // Realtime Visitor Counter Sync
    async function initVisitorCount() {
      try {
        const ref = doc(db, "stats", "visitors");
        const snap = await getDoc(ref);
        if (snap.exists()) {
          await updateDoc(ref, { count: increment(1) });
        } else {
          await setDoc(ref, { count: 1 });
        }

        onSnapshot(ref, (docSnap) => {
          if (docSnap.exists()) {
            document.getElementById("visitorCount").textContent = docSnap.data().count;
          }
        });
      } catch (err) {
        console.error("Visitor counter error:", err);
        document.getElementById("visitorCount").textContent = "1,250+";
      }
    }
    initVisitorCount();
  </script>
</body>
</html>
