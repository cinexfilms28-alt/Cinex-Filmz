
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINEX | Admin Login</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;
      background:#070609;color:#fff;font-family:Arial,sans-serif;
      padding:20px
    }
    .panel{
      width:100%;max-width:390px;padding:32px;
      background:#121016;border:1px solid #302630;
      border-radius:18px;box-shadow:0 20px 70px #0008
    }
    h1{text-align:center;letter-spacing:3px;margin:0 0 8px}
    h1 span{color:#ff244b}
    p{text-align:center;color:#aaa;font-size:14px}
    label{display:block;margin:20px 0 8px;font-size:13px}
    input{
      width:100%;padding:13px;border-radius:9px;
      border:1px solid #38303a;background:#09080b;color:white;
      outline:none
    }
    input:focus{border-color:#ff244b}
    button{
      width:100%;padding:13px;margin-top:18px;border:0;
      border-radius:9px;background:#ff244b;color:white;
      font-weight:bold;cursor:pointer
    }
    button:disabled{opacity:.6;cursor:wait}
    #message{min-height:20px;font-size:13px;overflow-wrap:anywhere}
    #dashboard{display:none}
  </style>
</head>
<body>
  <main class="panel" id="login">
    <h1>CINE<span>X</span></h1>
    <p>ADMIN CONTROL CENTER</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginBtn" type="submit">SECURE LOGIN</button>
      <p id="message" role="status"></p>
    </form>
  </main>

  <main class="panel" id="dashboard">
    <h1>CINE<span>X</span></h1>
    <p>ADMIN DASHBOARD</p>
    <p id="welcome"></p>
    <button id="logoutBtn" type="button">LOG OUT</button>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
    import {
      getAuth, signInWithEmailAndPassword,
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA5t1V-cXpPYQJvMzQlrM5hhaVmTn1DtR8",
      authDomain: "cinex-admin.firebaseapp.com",
      projectId: "cinex-admin",
      appId: "1:454196788255:web:bdd192ef01b334abae292a"
    };

    // Replace this with the exact email you use for your admin account.
    const ADMIN_EMAIL = "cinexfilms28@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginPanel = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    function showLogin(text = "") {
      loginPanel.style.display = "block";
      dashboard.style.display = "none";
      message.textContent = text;
    }

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email &&
          user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase() &&
          user.emailVerified) {
        loginPanel.style.display = "none";
        dashboard.style.display = "block";
        document.getElementById("welcome").textContent =
          "Signed in as " + user.email;
      } else {
        if (user) await signOut(auth);
        showLogin(user ? "This account is not authorized." : "");
      }
    });

    document.getElementById("loginForm").addEventListener("submit",
      async (event) => {
        event.preventDefault();
        loginBtn.disabled = true;
        message.textContent = "Signing in...";

        try {
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const result = await signInWithEmailAndPassword(
            auth, email, password
          );

          if (!result.user.emailVerified ||
              result.user.email.toLowerCase() !==
              ADMIN_EMAIL.toLowerCase()) {
            await signOut(auth);
            showLogin("Admin account not authorized or email not verified.");
          }
        } catch (error) {
          showLogin("Login failed. Check your email and password.");
        } finally {
          loginBtn.disabled = false;
        }
      });

    document.getElementById("logoutBtn").addEventListener("click",
      () => signOut(auth)
    );
  </script>
</body>
</html>
